[package]
name = "prism"
edition = "2024"
version = "0.0.0"

[features]
default = []
linux-accel = ["dep:rustix", "dep:tokio-uring"]
benchmark = ["dep:criterion", "dep:nerd-font-symbols"]
schema = ["dep:schemars"]

[dependencies]
prism-minecraft = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
smart-default = { workspace = true }
smallvec = { workspace = true }
arc-swap = "1.7"
flurry = "0.5"
socket2 = { version = "0.6", default-features = false, features = ["all"] }
acta = { version = "0.0.1", features = ["compress", "serde", "custom-async"] }
parking_lot = "0.12"
valence_protocol = "0.2.0-alpha.1"
strum = { version = "0.28.0", features = ["derive"] }

criterion = { version = "0.8.2", features = ["html_reports"], optional = true }
nerd-font-symbols = { version = "0.3", optional = true }

schemars = { version = "1.0", features = ["derive"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["pipe", "std"], optional = true }
tokio-uring = { version = "0.5", optional = true }
libc = { version = "0.2" }
