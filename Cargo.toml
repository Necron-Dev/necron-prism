[workspace]
members = [".", "crates/prism-minecraft", "crates/prism"]
resolver = "2"

[workspace.dependencies]
prism = { path = "crates/prism" }
prism-minecraft = { path = "crates/prism-minecraft" }
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1.48", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "io-util", "sync", "macros", "fs", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"
smallvec = { version = "1", features = ["write"] }
thiserror = "2.0"
smart-default = "0.7"

[package]
name = "necron-prism"
edition = "2024"
authors = [ "Me0wo", "Necron-Dev" ]

[features]
default = ["http-api"]
http-api = ["dep:reqwest"]
linux-accel = ["prism/linux-accel"]
schema = ["dep:schemars", "prism/schema"]
benchmark = ["prism/benchmark"]

[dependencies]
prism = { workspace = true }
prism-minecraft = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
smart-default = { workspace = true }
acta = { version = "0.0.1", features = ["compress", "serde", "nerd", "custom-async"] }
toml = "1.0.7"
schemars = { version = "1.0", features = ["derive"], optional = true }
flurry = "0.5"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "rustls"], optional = true }
http = "1.4.0"
tokio-util = "0.7"
uuid = { version = "1", features = ["v3"] }
seize = "0.5"
base64 = "0.22"
mime_guess = { version = "2.0", default-features = false }

[[bin]]
name = "schema"
path = "src/bin/schema.rs"
required-features = ["schema"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
incremental = false
